<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Trip Tracker — live</title>
<meta name="theme-color" content="#FCFBF8">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/trip-elevation.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root {
  --font-ui: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --p-bg: #FCFBF8;
  --p-surface: #FFFFFF;
  --p-border: #E5E1D4;
  --p-text-primary: #1D2018;
  --p-text-secondary: #5C5A48;
  --p-accent: #2E5339;
  --p-accent-subtle: #E6EEE3;
  --p-accent-secondary: #C1602E;
  --p-success: #2E6B45;
  --p-success-subtle: #E4EFE6;
  --p-warning: #A8721F;
  --p-warning-subtle: #F7EDD8;
  --p-danger: #AC3B31;
  --p-danger-subtle: #F8E5E2;
  --p-shadow: 0 2px 10px rgba(35, 38, 31, 0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-ui); background: var(--p-bg); color: var(--p-text-primary); min-height: 100vh; }
.wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 60px; }
.card { background: var(--p-surface); border: 1px solid var(--p-border); border-radius: 14px; padding: 18px; margin-bottom: 14px; box-shadow: var(--p-shadow); }
.card.today { background: var(--p-accent-subtle); border-color: var(--p-accent); }
h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.muted { color: var(--p-text-secondary); font-size: 14px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--p-text-secondary); margin-bottom: 10px; }
.eyebrow.on-accent { color: var(--p-accent); }
.progress-figure { font-family: var(--font-mono); font-weight: 600; font-size: 17px; }
.dayrow { display: flex; gap: 14px; padding: 14px 0; border-top: 1px solid var(--p-border); }
.dayrow:first-child { border-top: none; padding-top: 4px; }
.dayrow.is-today { margin: 0 -12px; padding: 14px 12px; background: var(--p-accent-subtle); border-radius: 10px; border-top-color: transparent; }
.dayrow.is-today + .dayrow { border-top-color: transparent; }
.daynum { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-family: var(--font-mono); font-size: 13px; color: var(--p-accent); background: var(--p-accent-subtle); flex-shrink: 0; }
.dayrow.is-today .daynum { background: var(--p-accent); color: #fff; }
.dayrow .daytitle { font-weight: 600; font-size: 16px; }
.dayrow .daymeta { font-family: var(--font-mono); font-size: 13px; color: var(--p-text-secondary); margin-top: 2px; }
.pbar { height: 6px; background: var(--p-accent-subtle); border-radius: 3px; overflow: hidden; margin-top: 10px; }
.pbar > div { height: 100%; background: var(--p-accent); }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--p-accent-subtle); border: 1px solid var(--p-accent); color: var(--p-accent); }
.badge-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--p-accent-secondary); flex: none; }
a { color: var(--p-accent); font-weight: 500; }
a:hover { color: var(--p-accent-secondary); }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.gallery img { width: 100%; height: 100px; object-fit: cover; border-radius: 10px; cursor: zoom-in; transition: opacity .15s; }
.gallery img:hover { opacity: .88; }
#lb { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.9); z-index: 9999;
  align-items: center; justify-content: center; flex-direction: column; gap: 14px; cursor: zoom-out; }
#lb img { max-width: 92vw; max-height: 82vh; border-radius: 14px; object-fit: contain; box-shadow: 0 8px 48px rgba(0,0,0,.6); }
#lb .lb-cap { color: #fff; font-size: 14px; text-align: center; max-width: 520px; opacity: .85; padding: 0 16px; }
#lb .lb-nav { position: fixed; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,.15);
  border: none; border-radius: 50%; width: 42px; height: 42px; color: #fff; font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: background .15s; }
#lb .lb-nav:hover { background: rgba(255,255,255,.28); }
#lb .lb-prev { left: 14px; }
#lb .lb-next { right: 14px; }
#lb .lb-close { position: fixed; top: 14px; right: 18px; background: none; border: none;
  color: #fff; font-size: 26px; cursor: pointer; opacity: .7; line-height: 1; padding: 4px; }
#lb .lb-close:hover { opacity: 1; }
.stay-note { font-size: 14px; margin-top: 4px; color: var(--p-text-primary); }
.stat-row { display: flex; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--p-border); }
.card.today .stat-row { border-top-color: rgba(46,83,57,0.18); }
.stat { flex: 1; text-align: center; }
.stat .stat-value { font-family: var(--font-mono); font-weight: 700; font-size: 17px; color: var(--p-text-primary); }
.stat .stat-label { font-size: 11px; color: var(--p-text-secondary); margin-top: 2px; text-transform: uppercase; letter-spacing: .03em; }
.stay-card { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 12px 0; border-top: 1px solid var(--p-border); }
.stay-card:first-child { border-top: none; }
.error-card { text-align: center; padding: 40px 20px; }
input[type="password"] { font-family: var(--font-ui); font-size: 15px; padding: 10px 12px; width: 100%;
  background: var(--p-bg); border: 1px solid var(--p-border); border-radius: 8px; color: var(--p-text-primary); outline: none; }
input[type="password"]:focus { border-color: var(--p-accent); }
button { font-family: var(--font-ui); font-weight: 600; font-size: 14px; padding: 10px 16px; background: var(--p-accent);
  border: none; border-radius: 8px; color: #fff; cursor: pointer; }
.epbtn { font-family: var(--font-ui); font-weight: 600; font-size: 12px; padding: 5px 11px; background: var(--p-surface);
  border: 1px solid var(--p-border); border-radius: 999px; color: var(--p-text-secondary); cursor: pointer; }
.epbtn.on { background: var(--p-accent-subtle); border-color: var(--p-accent); color: var(--p-accent); }
</style>
</head>
<body>
<div class="wrap" id="app">Loading…</div>
<script>
const SB_URL = 'https://evlmgtoysvcumluwmusa.supabase.co';
const SB_KEY = 'sb_publishable_EBGf9roabpx5-brXuia6ug_YWkOVc4K';
const sb = supabase.createClient(SB_URL, SB_KEY);

function esc(s) { return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function titleCase(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

let triedPasscode = false;
async function load(passcode) {
  if (passcode) triedPasscode = true;
  const params = new URLSearchParams(location.search);
  const token = params.get('t');
  const app = document.getElementById('app');
  if (!token) { app.innerHTML = '<div class="card error-card"><h2>No trip link given</h2><div class="muted" style="margin-top:6px;">Ask the organizer for the share link.</div></div>'; return; }
  const { data, error } = await sb.schema('app').rpc('public_trip_view', { p_token: token, p_passcode: passcode || null });
  if (error) { app.innerHTML = '<div class="card error-card"><h2>Could not load this trip</h2><div class="muted" style="margin-top:6px;">Try refreshing the page.</div></div>'; return; }
  if (data.error === 'not_found') { app.innerHTML = '<div class="card error-card"><h2>This link is not active</h2><div class="muted" style="margin-top:6px;">Ask the organizer for a current link.</div></div>'; return; }
  if (data.error === 'passcode_required') {
    app.innerHTML = `<div class="card">
      <h2>This trip is passcode-protected</h2>
      <div class="muted" style="margin:4px 0 12px;">${triedPasscode ? "That passcode didn't work — try again." : "Ask the organizer for the passcode."}</div>
      <input type="password" id="pcInput" placeholder="Passcode" style="margin-bottom:10px;" onkeydown="if(event.key==='Enter')load(document.getElementById('pcInput').value)">
      <button onclick="load(document.getElementById('pcInput').value)">Unlock</button></div>`;
    document.getElementById('pcInput').focus();
    return;
  }
  render(data);
}

function render(data) {
  const t = data.trip;
  const days = data.days || [];
  const stays = data.unlinkedStays || [];
  const doneKm = days.reduce((s,d) => s + (Number(d.riddenKm)||0), 0);
  const totalKm = days.reduce((s,d) => s + (Number(d.distanceKm)||0), 0);
  const totalAscent = days.reduce((s,d) => s + (Number(d.ascentM)||0), 0);
  const daysWithData = days.filter(d => d.distanceKm || d.ascentM || d.isRestDay);
  const todayIso = new Date().toISOString().slice(0,10);
  const todayDay = days.find(d => d.date === todayIso);

  document.getElementById('app').innerHTML = `
    <div class="card">
      <h1>${esc(t.name)}</h1>
      <div class="muted" style="margin-top:4px;">${t.startDate||''} ${t.endDate ? '– ' + t.endDate : ''}</div>
      ${totalKm ? `<div style="margin-top:14px;">
        <span class="progress-figure">${doneKm.toFixed(0)} / ${totalKm.toFixed(0)} km</span>
        <div class="pbar"><div style="width:${Math.min(100, totalKm ? doneKm/totalKm*100 : 0)}%;"></div></div>
      </div>` : ''}
      ${totalAscent ? `<div style="margin-top:8px;font-size:13px;color:var(--p-text-secondary);">Total ascent: <strong style="color:var(--p-text-primary);">+${totalAscent.toLocaleString()} m</strong></div>` : ''}
    </div>

    ${todayDay ? todayCardHtml(todayDay, days.length) : ''}

    ${(data.trackingLinks||[]).length ? `<div class="card">
      <span class="badge"><span class="badge-dot"></span>Live tracking</span>
      <div style="margin-top:12px;display:flex;flex-direction:column;gap:8px;">
        ${data.trackingLinks.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join('')}
      </div>
    </div>` : ''}

    ${daysWithData.length > 1 ? elevationChartHtml(days) : ''}

    ${days.some(d => d.gpxUrl) ? `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
        <div class="eyebrow" style="margin:0;">Elevation profile</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;" id="epBtns">
          <button class="epbtn on" data-ep="all" onclick="showEp('all')">Whole trip</button>
          ${days.filter(d=>d.gpxUrl).map(d=>`<button class="epbtn" data-ep="${d.dayNumber}" onclick="showEp(${d.dayNumber})">Day ${d.dayNumber}</button>`).join('')}
        </div>
      </div>
      <div id="epMeta" class="muted" style="font-size:12px;margin-bottom:8px;">Loading tracks…</div>
      <div style="overflow-x:auto;-webkit-overflow-scrolling:touch;"><div id="epChart"></div></div>
    </div>` : ''}

    <div class="card">
      <div class="eyebrow">Route</div>
      ${days.map(d => dayRowHtml(d, d.date === todayIso)).join('')}
    </div>

    ${stays.length ? `<div class="card">
      <div class="eyebrow">Other stays</div>
      ${stays.map(s => `
        <div class="stay-card">
          <div>
            <div class="daytitle" style="font-size:14px;">${esc(s.name)}</div>
            ${s.address ? `<div class="muted" style="margin-top:2px;">${esc(s.address)}</div>` : ''}
            ${s.bookingReference ? `<div class="muted" style="margin-top:2px;">Ref: ${esc(s.bookingReference)}</div>` : ''}
          </div>
          ${s.mapUrl ? `<a href="${esc(s.mapUrl)}" target="_blank" rel="noopener" style="white-space:nowrap;">Map ↗</a>` : ''}
        </div>
      `).join('')}
    </div>` : ''}

    ${(data.photos||[]).length ? `<div class="card">
      <div class="eyebrow">Photos</div>
      <div class="gallery">
        ${data.photos.map((p,i) => `<img src="${esc(p.photoUrl)}" alt="${esc(p.caption||'')}" loading="lazy" onclick="openLb(${i})">`).join('')}
      </div>
    </div>` : ''}
  `;
  window._epDays = days.filter(d => d.gpxUrl);
  if (window._epDays.length) showEp('all');
  window._lbPhotos = (data.photos||[]);
  document.getElementById('app').insertAdjacentHTML('beforeend', `
    <div id="lb" onclick="handleLbClick(event)">
      <button class="lb-close" onclick="closeLb(event)" aria-label="Close">✕</button>
      <button class="lb-nav lb-prev" onclick="lbStep(event,-1)" aria-label="Previous">‹</button>
      <img id="lb-img" src="" alt="">
      <div id="lb-cap" class="lb-cap"></div>
      <button class="lb-nav lb-next" onclick="lbStep(event,1)" aria-label="Next">›</button>
    </div>
  `);
}

function elevationChartHtml(days) {
  const maxAscent = Math.max(...days.map(d => Number(d.ascentM)||0), 1);
  const maxDist   = Math.max(...days.map(d => Number(d.distanceKm)||0), 1);
  const barW = Math.max(20, Math.min(40, Math.floor(580 / days.length) - 4));
  const gap = 4;
  const chartH = 80;
  const labelH = 20;
  const svgW = days.length * (barW + gap);
  const bars = days.map((d, i) => {
    const x = i * (barW + gap);
    // ascent bar (green)
    const asH = d.ascentM ? Math.max(3, Math.round((Number(d.ascentM) / maxAscent) * chartH)) : 0;
    // km bar (blue/teal overlay)
    const kmH = d.distanceKm ? Math.max(3, Math.round((Number(d.distanceKm) / maxDist) * chartH * 0.6)) : 0;
    const isToday = d.date === new Date().toISOString().slice(0,10);
    const fill = isToday ? '#2E5339' : (d.isRestDay ? '#E3DFD3' : '#7FB587');
    const kmFill = isToday ? '#C1602E' : '#A9CBB0';
    return `
      ${asH ? `<rect x="${x}" y="${chartH - asH}" width="${barW}" height="${asH}" rx="3" fill="${fill}" opacity="${isToday?1:.75}">
        <title>Day ${d.dayNumber}: +${d.ascentM} m ascent</title></rect>` : ''}
      ${kmH ? `<rect x="${x}" y="${chartH - kmH}" width="${barW}" height="${kmH}" rx="3" fill="${kmFill}" opacity=".45">
        <title>Day ${d.dayNumber}: ${d.distanceKm} km</title></rect>` : ''}
      <text x="${x + barW/2}" y="${chartH + labelH - 4}" text-anchor="middle" font-size="9" fill="currentColor" opacity=".55">${d.dayNumber}</text>
      ${isToday ? `<rect x="${x - 1}" y="${chartH - (asH||4) - 3}" width="${barW + 2}" height="${(asH||4) + 4}" rx="4" fill="none" stroke="#2E5339" stroke-width="1.5"/>` : ''}
    `;
  }).join('');

  return `<div class="card" style="margin-bottom:14px;">
    <div class="eyebrow" style="margin-bottom:12px;">Elevation &amp; distance per day</div>
    <div style="overflow-x:auto;-webkit-overflow-scrolling:touch;">
      <svg viewBox="0 0 ${svgW} ${chartH + labelH}" width="${svgW}" height="${chartH + labelH}" style="min-width:${svgW}px;display:block;color:var(--p-text-secondary);">
        ${bars}
      </svg>
    </div>
    <div style="display:flex;gap:14px;margin-top:8px;font-size:11px;color:var(--p-text-secondary);">
      <span><span style="display:inline-block;width:10px;height:10px;background:#7FB587;border-radius:2px;margin-right:4px;vertical-align:middle;"></span>Ascent (m)</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:#A9CBB0;border-radius:2px;margin-right:4px;vertical-align:middle;opacity:.7;"></span>Distance (km, scaled)</span>
      <span style="margin-left:auto;">Day ${days.findIndex(d=>d.date===new Date().toISOString().slice(0,10))+1 || '?'} highlighted</span>
    </div>
  </div>`;
}

function todayCardHtml(d, totalDays) {
  const stats = d.isRestDay
    ? `<div class="stat-row"><div class="stat" style="flex:1;"><div class="stat-value">Rest day</div><div class="stat-label">no riding today</div></div></div>`
    : `<div class="stat-row">
        <div class="stat"><div class="stat-value">${d.distanceKm ? d.distanceKm + ' km' : '—'}</div><div class="stat-label">Distance</div></div>
        <div class="stat"><div class="stat-value">${d.ascentM ? '+' + d.ascentM + ' m' : '—'}</div><div class="stat-label">Elevation</div></div>
        <div class="stat"><div class="stat-value">${d.surface ? titleCase(d.surface) : '—'}</div><div class="stat-label">Surface</div></div>
      </div>`;
  const mapIframe = d.mapEmbedUrl ? `<div style="margin-top:14px;"><iframe src="${esc(d.mapEmbedUrl)}" width="100%" height="220" frameborder="0" style="border-radius:8px;display:block;" loading="lazy" allowfullscreen></iframe></div>` : '';
  const desc = (d.descriptionEn || d.description) ? `<div style="margin-top:10px;font-size:14px;color:var(--p-text-primary);opacity:.8;line-height:1.5;">${esc(d.descriptionEn || d.description)}</div>` : '';
  return `
    <div class="card today">
      <div class="eyebrow on-accent">Today · Day ${d.dayNumber} of ${totalDays}</div>
      <h2 style="font-size:20px;">${esc(d.titleEn || d.title || 'Day ' + d.dayNumber)}</h2>
      ${stats}
      ${desc}
      ${d.accommodationName ? `<div class="stay-note" style="margin-top:14px;">
          <strong>Tonight:</strong> ${esc(d.accommodationName)}
          ${d.accommodationMapUrl ? ` · <a href="${esc(d.accommodationMapUrl)}" target="_blank" rel="noopener">Map ↗</a>` : (d.accommodationAddress ? ' — ' + esc(d.accommodationAddress) : '')}
        </div>` : ''}
      ${mapIframe}
    </div>
  `;
}

function dayRowHtml(d, isToday) {
  const desc = (d.descriptionEn || d.description) ? `<div style="font-size:12px;color:var(--p-text-secondary);margin-top:3px;opacity:.8;">${esc((d.descriptionEn||d.description).slice(0,100))}${(d.descriptionEn||d.description).length>100?'…':''}</div>` : '';
  return `
    <div class="dayrow${isToday ? ' is-today' : ''}">
      <div class="daynum">${d.dayNumber}</div>
      <div style="flex:1;min-width:0;">
        <div class="daytitle">${esc(d.titleEn || d.title || 'Day ' + d.dayNumber)}</div>
        <div class="daymeta">${d.date||''}${d.isRestDay ? ' · rest day' : ''}${d.distanceKm ? ' · ' + d.distanceKm + ' km' : ''}${d.ascentM ? ' · +' + d.ascentM + ' m' : ''}${d.surface ? ' · ' + titleCase(d.surface) : ''}</div>
        ${desc}
        ${d.accommodationName ? `<div class="stay-note">${esc(d.accommodationName)}${d.accommodationMapUrl ? ` · <a href="${esc(d.accommodationMapUrl)}" target="_blank" rel="noopener">Map ↗</a>` : (d.accommodationAddress ? ' — ' + esc(d.accommodationAddress) : '')}</div>` : ''}
      </div>
    </div>
  `;
}
// Elevation profile switcher. Colours are passed explicitly because the shared
// module defaults to the admin app's tokens, and this page uses --p-* ones.
const EP_COLORS = { stroke:'var(--p-accent)', fill:'var(--p-accent)', grid:'var(--p-border)', text:'var(--p-text-secondary)' };
async function showEp(which) {
  const chart = document.getElementById('epChart');
  const meta = document.getElementById('epMeta');
  if (!chart) return;
  document.querySelectorAll('#epBtns .epbtn').forEach(b => b.classList.toggle('on', b.dataset.ep === String(which)));
  chart.innerHTML = ''; meta.textContent = 'Loading…';
  const dayList = window._epDays || [];

  if (which === 'all') {
    const profiles = await Promise.all(dayList.map(d => fetchProfile(d.gpxUrl)));
    const good = profiles.filter(p => p && p.hasEle);
    if (!good.length) { meta.textContent = 'No elevation data available.'; return; }
    const merged = { dist: [], ele: [], gain: [], hasEle: true };
    let kmOff = 0, gainOff = 0;
    good.forEach(p => {
      for (let i = 0; i < p.dist.length; i++) {
        merged.dist.push(kmOff + p.dist[i]); merged.ele.push(p.ele[i]); merged.gain.push(gainOff + p.gain[i]);
      }
      kmOff += p.totalKm; gainOff += p.totalGain;
    });
    merged.totalKm = kmOff; merged.totalGain = gainOff;
    merged.minEle = Math.min(...merged.ele); merged.maxEle = Math.max(...merged.ele);
    chart.innerHTML = buildElevationSvg(merged, Object.assign({ height: 190 }, EP_COLORS));
    meta.textContent = `${merged.totalKm.toFixed(0)} km · +${Math.round(merged.totalGain)} m climbed · ${merged.minEle.toFixed(0)}–${merged.maxEle.toFixed(0)} m`;
    return;
  }

  const day = dayList.find(d => d.dayNumber === which);
  const p = day ? await fetchProfile(day.gpxUrl) : null;
  if (!p || !p.hasEle) { meta.textContent = 'No elevation data for that day.'; return; }
  // If the day is in progress, mark how far along the route they are.
  const ridden = Number(day.riddenKm) || 0;
  const frac = p.totalKm ? Math.min(1, ridden / p.totalKm) : 0;
  chart.innerHTML = buildElevationSvg(p, Object.assign({ height: 190, showMarker: ridden > 0, frac, markerColor: 'var(--p-accent-secondary)' }, EP_COLORS));
  meta.textContent = `Day ${day.dayNumber} · ${p.totalKm.toFixed(1)} km · +${Math.round(p.totalGain)} m · ${p.minEle.toFixed(0)}–${p.maxEle.toFixed(0)} m`
    + (ridden > 0 ? ` · ${ridden.toFixed(1)} km done` : '');
}

let _lbIdx = 0;
function openLb(i) {
  _lbIdx = i;
  const photos = window._lbPhotos || [];
  if (!photos.length) return;
  document.getElementById('lb-img').src = photos[i].photoUrl || '';
  document.getElementById('lb-cap').textContent = photos[i].caption || '';
  const lb = document.getElementById('lb');
  lb.style.display = 'flex';
  document.addEventListener('keydown', lbKey);
}
function closeLb(e) { if (e) e.stopPropagation(); document.getElementById('lb').style.display = 'none'; document.removeEventListener('keydown', lbKey); }
function handleLbClick(e) { if (e.target === document.getElementById('lb')) closeLb(); }
function lbStep(e, dir) {
  e.stopPropagation();
  const photos = window._lbPhotos || [];
  _lbIdx = (_lbIdx + dir + photos.length) % photos.length;
  document.getElementById('lb-img').src = photos[_lbIdx].photoUrl || '';
  document.getElementById('lb-cap').textContent = photos[_lbIdx].caption || '';
}
function lbKey(e) {
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowRight') lbStep(e, 1);
  if (e.key === 'ArrowLeft') lbStep(e, -1);
}

load();
</script>
</body>
</html>
