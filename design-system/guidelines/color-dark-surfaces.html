<!-- @dsCard group="Colors" viewport="700x180" subtitle="Dark theme is a distinct warm charcoal, not inverted light" name="Dark — Surfaces & Text" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box;}body{margin:0;padding:14px 16px;font-family:var(--font-ui);}</style></head><body><div data-theme="dark" style="background:var(--bg-page);padding:14px;border-radius:10px;display:flex;gap:14px;flex-wrap:wrap;">
    <div style="display:flex;flex-direction:column;gap:6px;width:96px;">
    <div style="height:44px;border-radius:8px;border:1px solid var(--border-hairline);background:var(--bg-page);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text-secondary);font-family:var(--font-mono);"></div>
    <div style="font-size:10px;font-family:var(--font-mono);color:var(--text-secondary);line-height:1.3;">page<br>--bg-page</div>
  </div><div style="display:flex;flex-direction:column;gap:6px;width:96px;">
    <div style="height:44px;border-radius:8px;border:1px solid var(--border-hairline);background:var(--bg-sidebar);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text-secondary);font-family:var(--font-mono);"></div>
    <div style="font-size:10px;font-family:var(--font-mono);color:var(--text-secondary);line-height:1.3;">sidebar<br>--bg-sidebar</div>
  </div><div style="display:flex;flex-direction:column;gap:6px;width:96px;">
    <div style="height:44px;border-radius:8px;border:1px solid var(--border-hairline);background:var(--bg-card);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text-secondary);font-family:var(--font-mono);"></div>
    <div style="font-size:10px;font-family:var(--font-mono);color:var(--text-secondary);line-height:1.3;">card<br>--bg-card</div>
  </div><div style="display:flex;flex-direction:column;gap:6px;width:96px;">
    <div style="height:44px;border-radius:8px;border:1px solid var(--border-hairline);background:var(--bg-recessed);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text-secondary);font-family:var(--font-mono);"></div>
    <div style="font-size:10px;font-family:var(--font-mono);color:var(--text-secondary);line-height:1.3;">recessed/input<br>--bg-recessed</div>
  </div>
    <div style="display:flex;flex-direction:column;gap:6px;width:96px;">
    <div style="height:44px;border-radius:8px;border:1px solid var(--border-hairline);background:var(--border-hairline);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text-secondary);font-family:var(--font-mono);"></div>
    <div style="font-size:10px;font-family:var(--font-mono);color:var(--text-secondary);line-height:1.3;">hairline<br>--border-hairline</div>
  </div>
    <div style="display:flex;flex-direction:column;gap:6px;width:170px;">
      <div style="font-size:20px;color:var(--text-primary);font-weight:600;">Primary text</div>
      <div style="font-size:13px;color:var(--text-secondary);">Secondary text</div>
    </div>
  </div></body></html>
