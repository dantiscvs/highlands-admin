<!-- @dsCard group="Colors" viewport="700x150" subtitle="One accent hue per trip activity type" name="Activity-type chips" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box;}body{margin:0;padding:14px 16px;font-family:var(--font-ui);}</style></head><body><div style="display:flex;gap:10px;flex-wrap:wrap;">
    <div style="display:flex;align-items:center;gap:6px;background:var(--activity-cycling-subtle);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--text-primary);"><span style="width:8px;height:8px;border-radius:50%;background:var(--activity-cycling);"></span>cycling</div><div style="display:flex;align-items:center;gap:6px;background:var(--activity-hiking-subtle);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--text-primary);"><span style="width:8px;height:8px;border-radius:50%;background:var(--activity-hiking);"></span>hiking</div><div style="display:flex;align-items:center;gap:6px;background:var(--activity-driving-subtle);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--text-primary);"><span style="width:8px;height:8px;border-radius:50%;background:var(--activity-driving);"></span>driving</div><div style="display:flex;align-items:center;gap:6px;background:var(--activity-kayaking-subtle);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--text-primary);"><span style="width:8px;height:8px;border-radius:50%;background:var(--activity-kayaking);"></span>kayaking</div><div style="display:flex;align-items:center;gap:6px;background:var(--activity-transit-subtle);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--text-primary);"><span style="width:8px;height:8px;border-radius:50%;background:var(--activity-transit);"></span>transit</div>
  </div></body></html>
