<!-- @dsCard group="Colors" viewport="700x160" subtitle="Simplified light-only palette for the rider-facing page" name="Participant theme" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box;}body{margin:0;padding:14px 16px;font-family:var(--font-ui);}</style></head><body><div class="participant-theme" style="background:var(--p-bg);padding:14px;border-radius:10px;display:flex;gap:14px;flex-wrap:wrap;">
    <div style="display:flex;flex-direction:column;gap:6px;width:90px;"><div style="height:40px;border-radius:8px;background:var(--p-surface);border:1px solid var(--p-border);"></div><div style="font-size:10px;font-family:var(--font-mono);color:var(--p-text-secondary);">surface</div></div>
    <div style="display:flex;flex-direction:column;gap:6px;width:90px;"><div style="height:40px;border-radius:8px;background:var(--p-accent);"></div><div style="font-size:10px;font-family:var(--font-mono);color:var(--p-text-secondary);">accent</div></div>
    <div style="display:flex;flex-direction:column;gap:6px;width:90px;"><div style="height:40px;border-radius:8px;background:var(--p-accent-secondary);"></div><div style="font-size:10px;font-family:var(--font-mono);color:var(--p-text-secondary);">accent-2</div></div>
    <div style="display:flex;flex-direction:column;gap:6px;width:90px;"><div style="height:40px;border-radius:8px;background:var(--p-success-subtle);border:1px solid var(--p-success);"></div><div style="font-size:10px;font-family:var(--font-mono);color:var(--p-text-secondary);">success</div></div>
    <div style="display:flex;flex-direction:column;gap:6px;width:90px;"><div style="height:40px;border-radius:8px;background:var(--p-warning-subtle);border:1px solid var(--p-warning);"></div><div style="font-size:10px;font-family:var(--font-mono);color:var(--p-text-secondary);">warning</div></div>
  </div></body></html>
