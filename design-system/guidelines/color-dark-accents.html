<!-- @dsCard group="Colors" viewport="700x180" subtitle="Lightened, desaturated for dark-surface contrast" name="Dark — Accents & Semantic" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box;}body{margin:0;padding:14px 16px;font-family:var(--font-ui);}</style></head><body><div data-theme="dark" style="background:var(--bg-page);padding:14px;border-radius:10px;display:flex;gap:14px;flex-wrap:wrap;">
    <div style="display:flex;flex-direction:column;gap:6px;width:96px;">
    <div style="height:44px;border-radius:8px;border:1px solid var(--border-hairline);background:var(--accent-primary);display:flex;align-items:center;justify-content:center;font-size:10px;color:#14150F;font-family:var(--font-mono);"></div>
    <div style="font-size:10px;font-family:var(--font-mono);color:var(--text-secondary);line-height:1.3;">primary<br>--accent-primary</div>
  </div><div style="display:flex;flex-direction:column;gap:6px;width:96px;">
    <div style="height:44px;border-radius:8px;border:1px solid var(--border-hairline);background:var(--accent-secondary);display:flex;align-items:center;justify-content:center;font-size:10px;color:#14150F;font-family:var(--font-mono);"></div>
    <div style="font-size:10px;font-family:var(--font-mono);color:var(--text-secondary);line-height:1.3;">secondary<br>--accent-secondary</div>
  </div><div style="display:flex;flex-direction:column;gap:6px;width:96px;">
    <div style="height:44px;border-radius:8px;border:1px solid var(--border-hairline);background:var(--color-success);display:flex;align-items:center;justify-content:center;font-size:10px;color:#14150F;font-family:var(--font-mono);"></div>
    <div style="font-size:10px;font-family:var(--font-mono);color:var(--text-secondary);line-height:1.3;">success<br>--color-success</div>
  </div><div style="display:flex;flex-direction:column;gap:6px;width:96px;">
    <div style="height:44px;border-radius:8px;border:1px solid var(--border-hairline);background:var(--color-warning);display:flex;align-items:center;justify-content:center;font-size:10px;color:#14150F;font-family:var(--font-mono);"></div>
    <div style="font-size:10px;font-family:var(--font-mono);color:var(--text-secondary);line-height:1.3;">warning<br>--color-warning</div>
  </div><div style="display:flex;flex-direction:column;gap:6px;width:96px;">
    <div style="height:44px;border-radius:8px;border:1px solid var(--border-hairline);background:var(--color-danger);display:flex;align-items:center;justify-content:center;font-size:10px;color:#14150F;font-family:var(--font-mono);"></div>
    <div style="font-size:10px;font-family:var(--font-mono);color:var(--text-secondary);line-height:1.3;">danger<br>--color-danger</div>
  </div><div style="display:flex;flex-direction:column;gap:6px;width:96px;">
    <div style="height:44px;border-radius:8px;border:1px solid var(--border-hairline);background:var(--color-info);display:flex;align-items:center;justify-content:center;font-size:10px;color:#14150F;font-family:var(--font-mono);"></div>
    <div style="font-size:10px;font-family:var(--font-mono);color:var(--text-secondary);line-height:1.3;">info<br>--color-info</div>
  </div>
  </div></body></html>
