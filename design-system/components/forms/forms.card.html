<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--bg-page);font-family:var(--font-ui);padding:20px;box-sizing:border-box;} .row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px;}</style>
</head><body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const NS = window.TripTracker || {};
const { Button, Input, Select, OpenMenu } = NS;
function App() {
  return (
    <div>
      <div className="row">
        <Button>Save trip</Button>
        <Button variant="secondary">Cancel</Button>
        <Button variant="danger">Delete day</Button>
        <Button variant="ghost">Dismiss</Button>
        <Button disabled>Saving…</Button>
        <Button size="sm">Small</Button>
      </div>
      <div className="row" style={{width:180}}><Input label="Trip title" placeholder="Alps ridge traverse" /></div>
      <div className="row" style={{width:140}}><Input label="Distance (km)" type="number" defaultValue="42" /></div>
      <div className="row" style={{width:170}}><Input label="Start date" type="date" /></div>
      <div className="row" style={{width:220}}><Input label="Riders" error="Must be at least 1" defaultValue="0" /></div>
      <div className="row" style={{width:200}}><Select label="Surface" options={["Paved","Gravel","Singletrack","Mixed"]} defaultValue="Gravel" /></div>
      <div className="row"><OpenMenu items={["Trailhead Lodge","Riverside Camp","Summit Hut"]} selected="Riverside Camp" /></div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
